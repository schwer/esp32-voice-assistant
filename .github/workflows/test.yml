name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  host:
    name: Host unit tests (C)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # Audio maths, battery estimator, Improv protocol, web helpers;
      # built with AddressSanitizer + UndefinedBehaviorSanitizer.
      - run: make -C tests/host

  tools:
    name: Tool and consistency checks (Python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install "pytest==8.3.5" "numpy==2.2.6"
      - run: python -m pytest -q tests/tools

  web:
    name: Browser tests (installer, setup, diagnostics)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tests/web
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: tests/web/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test
