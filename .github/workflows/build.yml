name: Build firmware

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Build with ESP-IDF
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v5.5
          target: esp32s3
          command: idf.py build

      # Flash images are published as separate parts at their own offsets.
      # Never as one merged image: that would also overwrite the NVS partition
      # and wipe the user's Wi-Fi and API key on every update.
      - name: Collect firmware parts
        run: |
          sudo chown -R "$USER" build
          python3 tools/collect_parts.py build out
          ls -la out

      - uses: actions/upload-artifact@v4
        with:
          name: firmware
          path: out/
          if-no-files-found: error

  pages:
    # Publish the web flasher with the latest firmware from main.
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v4
        with:
          name: firmware
          path: web/firmware

      - name: Write manifest
        run: |
          VERSION="$(date -u +%Y.%m.%d)-${GITHUB_SHA::7}"
          python3 tools/write_manifest.py web/firmware/parts.json "$VERSION" "${GITHUB_SHA}" > web/manifest.json
          sed -i "s/__VERSION__/${VERSION}/g" web/*.html
          cat web/manifest.json

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - id: deploy
        uses: actions/deploy-pages@v4
