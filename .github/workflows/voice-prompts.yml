name: Generate voice prompts

# Regenerates the spoken status clips when the phrase list or generator changes,
# and commits them so firmware builds are reproducible and reviewable.
on:
  push:
    branches: [main]
    paths:
      - tools/prompts.tsv
      - tools/gen_prompts.py
      - .github/workflows/voice-prompts.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: voice-prompts
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Piper TTS
        run: python -m pip install "piper-tts==1.8.0" "soxr==0.5.0" "scipy==1.18.1"

      - name: Download voice (LJ Speech, public domain dataset)
        run: python -m piper.download_voices --data-dir voices en_US-ljspeech-high

      - name: Generate clips
        run: python tools/gen_prompts.py voices/en_US-ljspeech-high.onnx tools/prompts.tsv components/prompts/clips

      - name: Commit clips
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add components/prompts/clips
          if git diff --cached --quiet; then
            echo "Clips unchanged"
          else
            git commit -m "Regenerate voice prompts"
            git push
          fi
