name: Build firmware

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # ESP-IDF stamps version.txt into the image; the board compares it with the
      # manifest's version to know whether an update is available.
      - name: Set the firmware version
        run: echo "$(date -u +%Y.%m.%d)-${GITHUB_SHA::7}" > version.txt

      - name: Build with ESP-IDF
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v5.5
          target: esp32s3
          command: idf.py build && idf.py size-components > build/size_components.txt

      # Keep the firmware small: fail above firmware_budget.json, report what takes space.
      - name: Check firmware size
        run: python3 tools/check_size.py build/esp32-voice-assistant.bin firmware_budget.json build/size_components.txt

      # Flash images are published as separate parts at their own offsets.
      # Never as one merged image: that would also overwrite the NVS partition
      # and wipe the user's Wi-Fi and API key on every update.
      - name: Collect firmware parts
        run: |
          sudo chown -R "$USER" build
          python3 tools/collect_parts.py build out
          cp version.txt out/version.txt
          ls -la out

      - uses: actions/upload-artifact@v4
        with:
          name: firmware
          path: out/
          if-no-files-found: error

  pages:
    # Publish the web flasher with the latest firmware from main.
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url || steps.deploy_retry.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v4
        with:
          name: firmware
          path: web/firmware

      # "What's new", spoken: recorded in the built-in voice so the board can say it
      # even without Gemini. Optional: if it fails, the update just has no clip.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Record "what's new"
        continue-on-error: true
        run: |
          python -m pip install "piper-tts==1.8.0" "soxr==0.5.0" "scipy==1.18.1"
          python -m piper.download_voices --data-dir voices en_US-ljspeech-high
          printf 'notes\t%s\n' "$(python tools/whats_new.py)" > notes.tsv
          python tools/gen_prompts.py voices/en_US-ljspeech-high.onnx notes.tsv web/firmware ulaw
          ls -la web/firmware/notes.ulaw

      - name: Write manifest
        run: |
          VERSION="$(cat web/firmware/version.txt)"
          python3 tools/write_manifest.py web/firmware/parts.json "$VERSION" "${GITHUB_SHA}" web/firmware/notes.ulaw > web/manifest.json
          sed -i "s/__VERSION__/${VERSION}/g" web/*.html
          cat web/manifest.json

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
      # deploy-pages sometimes fails right after the upload with "Fetching artifact
      # metadata failed" (the artifact isn't visible to the API yet). Retry once.
      - id: deploy
        uses: actions/deploy-pages@v4
        continue-on-error: true
      - name: Wait before retrying the deployment
        if: steps.deploy.outcome == 'failure'
        run: sleep 30
      - id: deploy_retry
        if: steps.deploy.outcome == 'failure'
        uses: actions/deploy-pages@v4
